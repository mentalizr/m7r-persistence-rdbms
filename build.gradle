import java.nio.file.Paths

plugins {
    id 'java-library'
}

group 'org.mentalizr'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven { url "https://raw.githubusercontent.com/arthurpicht/mvn-repo/main/releases"}
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
            srcDir 'src/main/generated'
        }
    }
}


tasks.register('barnacle', Exec) {
//    println System.getenv("PATH")

    // Execution failed for task ':barnacle'.
    // Got problems? This one after changing dependencies?
    // Caused by: java.io.IOException: Cannot run program "barnacle" (in directory [...]/m7r/core/m7r-persistence-rdbms"):
    // error=2, Datei oder Verzeichnis nicht gefunden
    // Solution: kill gradle:
    // # gradle --stop
    // # ./gradlew --stop
    dependsOn('copyBarnacleConf')

    inputs.dir("$rootDir/src/main/java/org/mentalizr/persistence/rdbms/barnacle/vof")
    inputs.file("$rootDir/src/main/resources/barnacle.conf")
    outputs.dir("$rootDir/src/main/generated")
    outputs.dir("$buildDir/sql")

    mkdir "$buildDir/sql"

    doFirst {
        commandLine "barnacle", "--verbose", "--configfile", "$projectDir/src/main/resources/barnacle.conf", "generate"
    }

}

dependencies {
    implementation libs.m7r.commons
    implementation libs.m7r.serviceObjects

    implementation libs.ap.utils.core
    implementation libs.ap.barnacle

    implementation libs.qos.logback
    api libs.mkammerer.argon2
    implementation libs.mariadb.javaClient

    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.engine
}

test {
    useJUnitPlatform()
}

tasks.register('copyBarnacleConf', Copy) {
        def barnacleConf = Paths.get("$rootDir").resolve("../../infra/m7r-config/common/barnacle.conf").normalize().toFile()
        if (!barnacleConf.exists()) throw new GradleException(barnacleConf.absolutePath + " not found.");

        inputs.file(barnacleConf)
        outputs.file("$rootDir/src/main/resources/barnacle.conf")

        from file(barnacleConf)
        into "$rootDir/src/main/resources"
}

clean {
    delete "$rootDir/src/main/generated/org"
    delete "$rootDir/src/main/resources/barnacle.conf"
}

compileJava {
    dependsOn barnacle
}

processResources {
    dependsOn copyBarnacleConf
}

defaultTasks 'jar'
